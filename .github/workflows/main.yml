name: Trimite Stirile Zilnice

on:
  schedule:
    - cron: '0 5 * * *' # Rulează zilnic la ora 08:00 a României
  workflow_dispatch: # Permite rularea manuală

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă codul din repository
        uses: actions/checkout@v4

      - name: Configurează Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalează librăriile necesare
        run: pip install -r requirements.txt

      - name: Rulează scriptul de știri
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python news_bot.py

      - name: Salvează fișierul de știri în repository
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add stiri-*.md
          # Evită blocarea în caz că nu s-a schimbat nimic (deși se schimbă data zilnic)
          git diff-index --quiet HEAD || git commit -m "Adaugat stiri zilnice [skip ci]"
          git push
